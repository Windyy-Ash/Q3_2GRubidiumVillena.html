<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club/Organization Application</title>
    <style>
        :root {
            --lavender-50: #fdfbff;
            --lavender-100: #f6f0ff;
            --lavender-200: #ebddff;
            --lavender-400: #c7a7ff;
            --lavender-600: #7a4fd8;
            --lavender-700: #5a38aa;
            --ink: #1e1430;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 20px 80px;
            background: linear-gradient(130deg, var(--lavender-50), var(--lavender-200));
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 25%, rgba(122, 79, 216, 0.35), transparent 55%),
                radial-gradient(circle at 80% 15%, rgba(90, 56, 170, 0.25), transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(199, 167, 255, 0.4), transparent 60%);
            z-index: -1;
        }
        form {
            width: 100%;
            max-width: 760px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 28px 60px rgba(30, 20, 48, 0.2);
            padding: 40px;
            border: 1px solid rgba(122, 79, 216, 0.2);
            position: relative;
        }
        form::after {
            content: "";
            position: absolute;
            inset: 18px;
            border-radius: 18px;
            border: 1px solid rgba(199, 167, 255, 0.25);
            pointer-events: none;
        }
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            color: var(--lavender-700);
            letter-spacing: 0.02em;
        }
        fieldset {
            margin-bottom: 24px;
            padding: 20px 22px 26px;
            border-radius: 18px;
            border: 1px solid rgba(122, 79, 216, 0.25);
            background: linear-gradient(180deg, rgba(253, 251, 255, 0.9), rgba(246, 240, 255, 0.8));
        }
        legend {
            font-weight: 700;
            padding: 0 12px;
            color: var(--ink);
            letter-spacing: 0.05em;
        }
        label {
            display: block;
            margin-bottom: 16px;
            font-weight: 600;
            color: #5a4a75;
        }
        .form-control {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(122, 79, 216, 0.35);
            font-size: 1rem;
            background: var(--lavender-50);
            color: var(--ink);
            box-shadow: 0 12px 28px rgba(132, 99, 209, 0.15);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--lavender-600);
            box-shadow: 0 0 0 4px rgba(122, 79, 216, 0.25);
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .radio-group {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            align-items: center;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            font-weight: 600;
        }
        .radio-group input {
            width: auto;
        }
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
        }
        button {
            border: none;
            border-radius: 999px;
            padding: 14px 32px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        button.primary {
            background: linear-gradient(120deg, var(--lavender-600), var(--lavender-700));
            color: #fff;
            box-shadow: 0 14px 28px rgba(90, 56, 170, 0.35);
        }
        button.secondary {
            background: #fff;
            color: var(--lavender-700);
            border: 1px solid rgba(122, 79, 216, 0.3);
            box-shadow: 0 10px 24px rgba(199, 167, 255, 0.25);
        }
        button.link {
            background: rgba(30, 20, 48, 0.9);
            color: #fff;
            box-shadow: 0 12px 26px rgba(30, 20, 48, 0.25);
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(1px);
        }
        .error {
            border: 2px solid #d90429;
        }
        .status {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 600;
            background: rgba(253, 251, 255, 0.9);
        }
        .status.success {
            background: rgba(236, 253, 245, 0.95);
            color: #0f5132;
            border: 1px solid #9dd9b5;
        }
        .status.error {
            background: rgba(255, 238, 238, 0.95);
            color: #a3142d;
            border: 1px solid #ffb3c1;
        }
        @media (max-width: 640px) {
            form {
                padding: 28px;
            }
            .radio-group {
                gap: 10px;
            }
        }
    </style>
    <script>
        // We stash every submission under a single key here so both pages read the same data source.
        const STORAGE_KEY = 'clubSignups';

        function validateField(event) {
            if (!event.target.value.trim()) {
                event.target.classList.add('error');
            } else {
                event.target.classList.remove('error');
            }
        }

        function loadSignups() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (error) {
                console.error('Unable to read sign-up data', error);
                return [];
            }
        }

        function saveSignups(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function formatGrade(level) {
            return level ? `Grade ${level}` : '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('clubSignupForm');
            const statusMessage = document.getElementById('statusMessage');
            const viewBtn = document.getElementById('viewSignupsBtn');

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                if (!confirm('Submit this club sign-up?')) {
                    return;
                }

                // It grabs every field all at once so that it can save one clean object.
                const formData = new FormData(form);
                const record = {
                    id: formData.get('studentID').trim(),
                    fullName: formData.get('fullName').trim(),
                    birthday: formData.get('birthday'),
                    email: formData.get('email').trim(),
                    mobile: formData.get('mobilePhone').trim(),
                    gradeLevel: formData.get('gradeLevel'),
                    gradeLabel: formatGrade(formData.get('gradeLevel')),
                    role: formData.get('role') === 'extern' ? 'Extern' : 'Intern',
                    preferredClub: formData.get('preferredClub'),
                    reason: formData.get('reason').trim(),
                    createdAt: new Date().toISOString()
                };

                if (Object.values(record).some((value) => value === '' || value === null)) {
                    statusMessage.textContent = 'Please fill out every field before submitting.';
                    statusMessage.className = 'status error';
                    return;
                }

                // It appends instead of overwriting it so all the previous submissions remain available.
                const existing = loadSignups();
                existing.push(record);
                saveSignups(existing);

                statusMessage.textContent = `Sign-up saved! Total records stored: ${existing.length}`;
                statusMessage.className = 'status success';
                form.reset();
            });

            form.addEventListener('reset', (event) => {
                if (!confirm('Clear all entered information?')) {
                    event.preventDefault();
                    return;
                }
                statusMessage.textContent = '';
                statusMessage.className = 'status';
            });

            viewBtn.addEventListener('click', () => {
                window.location.href = 'Q3_2GRubidiumVillena.html';
            });
        });
    </script>
</head>
<body>
    <form id="clubSignupForm">
        <h1>Club / Organization Application</h1>
        <fieldset>
            <legend>Personal Information</legend>
            <label>
                Student ID:
                <input type="number" name="studentID" required onblur="validateField(event)">
            </label>
            <label>
                Full Name:
                <input type="text" name="fullName" required onblur="validateField(event)">
            </label>
            <label>
                Birthday:
                <input type="date" name="birthday" required onblur="validateField(event)">
            </label>
            <label>
                Email Address:
                <input type="email" name="email" required onblur="validateField(event)">
            </label>
        </fieldset>
        <fieldset>
            <legend>Contact and Preferences</legend>
            <label>
                Mobile Phone:
                <input type="text" name="mobilePhone" required onblur="validateField(event)">
            </label>
            <label>
                Grade Level:
                <select name="gradeLevel" required>
                    <option value="">Select Grade Level</option>
                    <option value="9">Grade 9</option>
                    <option value="10">Grade 10</option>
                    <option value="11">Grade 11</option>
                    <option value="12">Grade 12</option>
                </select>
            </label>
            <div class="form-control">
                <span>Intern/Extern:</span>
                <div class="radio-group">
                    <label><input type="radio" name="role" value="intern" required> Intern</label>
                    <label><input type="radio" name="role" value="extern" required> Extern</label>
                </div>
            </div>
            <label>
                Preferred Organization/Club:
                <select name="preferredClub" required>
                    <option value="">Select Club</option>
                    <option value="Science Club">Science Club</option>
                    <option value="Math Club">Math Club</option>
                    <option value="Arts Club">Arts Club</option>
                    <option value="Sports Club">Sports Club</option>
                    <option value="Music Club">Music Club</option>
                </select>
            </label>
            <label>
                Why do you want to join:
                <textarea name="reason" required onblur="validateField(event)"></textarea>
            </label>
        </fieldset>
        <div class="button-row">
            <button type="submit" class="primary">Submit</button>
            <button type="reset" class="secondary">Reset</button>
            <button type="button" id="viewSignupsBtn" class="link">View Sign-ups</button>
        </div>
        <p id="statusMessage" class="status" aria-live="polite"></p>
    </form>
</body>
</html>
