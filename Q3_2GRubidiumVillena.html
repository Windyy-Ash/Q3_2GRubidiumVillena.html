<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Club Sign-ups</title>
    <style>
        :root {
            --lavender-50: #fdfbff;
            --lavender-100: #f7f0ff;
            --lavender-200: #ede4ff;
            --lavender-300: #dac4ff;
            --lavender-500: #a475f9;
            --lavender-700: #5c3c9b;
            --ink: #2a1c42;
        }
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            background: linear-gradient(140deg, var(--lavender-50), var(--lavender-200));
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 15% 20%, rgba(164, 117, 249, 0.35), transparent 55%),
                radial-gradient(circle at 85% 15%, rgba(92, 60, 155, 0.25), transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(218, 196, 255, 0.5), transparent 60%);
            z-index: -1;
        }
        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .panel {
            background: #fff;
            border-radius: 22px;
            padding: 36px;
            box-shadow: 0 25px 60px rgba(42, 28, 66, 0.15);
            border: 1px solid var(--lavender-200);
            position: relative;
        }
        .panel::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 18px;
            border: 1px solid rgba(164, 117, 249, 0.12);
            pointer-events: none;
        }
        h1 {
            margin-top: 0;
            font-size: 2.3rem;
            color: var(--lavender-700);
        }
        .subtitle {
            margin: 4px 0 24px;
            color: #6b5c84;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--lavender-700);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(164, 117, 249, 0.12);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .nav-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(92, 60, 155, 0.18);
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
            margin-bottom: 12px;
        }
        label {
            font-weight: 600;
            color: #5a4a75;
        }
        select {
            min-width: 240px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--lavender-300);
            font-size: 1rem;
            background: var(--lavender-50);
            color: var(--ink);
            box-shadow: 0 10px 25px rgba(164, 117, 249, 0.15);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        select:focus {
            outline: none;
            border-color: var(--lavender-500);
            box-shadow: 0 0 0 4px rgba(164, 117, 249, 0.25);
        }
        .summary {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 14px 0 18px;
            color: var(--lavender-700);
        }
        .status-note {
            margin: 0 0 18px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(92, 60, 155, 0.2);
            background: rgba(253, 251, 255, 0.9);
            color: #4c3b6c;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 18px;
            border: 1px solid var(--lavender-200);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), #fff);
            box-shadow: 0 20px 40px rgba(42, 28, 66, 0.12);
        }
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 720px;
        }
        thead {
            background: linear-gradient(90deg, var(--lavender-500), var(--lavender-700));
            color: #fff;
        }
        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(218, 196, 255, 0.6);
        }
        tbody tr:nth-child(odd) {
            background: rgba(253, 251, 255, 0.8);
        }
        tbody tr:nth-child(even) {
            background: rgba(237, 228, 255, 0.5);
        }
        .hidden {
            display: none;
        }
        @media (max-width: 768px) {
            .panel {
                padding: 28px;
            }
            select {
                width: 100%;
            }
            table {
                min-width: 640px;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="panel">
            <h1>Show List of Students Who Signed-Up</h1>
            <p class="subtitle">by Ashley Villena!!</p>
            <a class="nav-link" href="index.html">&#8592; Back to Sign-up</a>

            <div class="controls">
                <label for="clubFilter">Select Your Club</label>
                <select id="clubFilter" aria-label="Filter sign-ups by club">
                    <option value="">-- select an option --</option>
                </select>
            </div>

            <p class="summary">Total Sign-up: <span id="totalCount">0</span></p>
            <p id="statusText" class="status-note">Loading saved sign-ups...</p>

            <div class="table-wrapper hidden" id="tableWrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Club</th>
                            <th>ID</th>
                            <th>Fullname</th>
                            <th>Grade</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Intern | Extern</th>
                        </tr>
                    </thead>
                    <tbody id="signupTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Sharing the same key as the form page keeps both views in sync without extra plumbing
        const STORAGE_KEY = 'clubSignups';
        const CLUBS = [
            'Science Club',
            'Math Club',
            'Arts Club',
            'Sports Club',
            'Music Club'
        ];

        function loadSignups() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (error) {
                console.error('Unable to load sign-ups', error);
                return [];
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const filter = document.getElementById('clubFilter');
            const totalCount = document.getElementById('totalCount');
            const tableBody = document.getElementById('signupTableBody');
            const statusText = document.getElementById('statusText');
            const tableWrapper = document.getElementById('tableWrapper');
            const signups = loadSignups();

            populateFilter(filter);
            filter.value = 'all';

            // The render is called whenever the filter changes so that table + total stay consistent
            function render(filteredList) {
                totalCount.textContent = filteredList.length;

                if (filteredList.length === 0) {
                    tableWrapper.classList.add('hidden');
                    statusText.textContent = signups.length === 0
                        ? 'No sign-ups have been saved yet. Encourage students to submit the form!'
                        : buildEmptyMessage(filter.value);
                    return;
                }

                tableWrapper.classList.remove('hidden');
                statusText.textContent = '';
                tableBody.innerHTML = '';

                filteredList.forEach((entry) => {
                    const row = document.createElement('tr');
                    const cells = [
                        entry.preferredClub,
                        entry.id,
                        entry.fullName,
                        entry.gradeLabel,
                        entry.email,
                        entry.mobile,
                        entry.role
                    ];

                    cells.forEach((value) => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    tableBody.appendChild(row);
                });
            }

            function buildEmptyMessage(selectedValue) {
                if (selectedValue === 'all' || selectedValue === '') {
                    return 'There are currently no stored sign-ups to show.';
                }
                return `No sign-ups for ${selectedValue}.`;
            }

            function getFilteredList(value) {
                if (value === 'all' || value === '') {
                    return signups;
                }
                return signups.filter((entry) => entry.preferredClub === value);
            }

            render(getFilteredList(filter.value));

            filter.addEventListener('change', () => {
                // It only filters when the dropdown changes.
                const filtered = getFilteredList(filter.value);
                render(filtered);
            });
        });

        function populateFilter(selectEl) {
            const frag = document.createDocumentFragment();
            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = 'All Clubs';
            frag.appendChild(allOption);

            CLUBS.forEach((club) => {
                const option = document.createElement('option');
                option.value = club;
                option.textContent = club;
                frag.appendChild(option);
            });

            selectEl.appendChild(frag);
        }
    </script>
</body>
</html>
