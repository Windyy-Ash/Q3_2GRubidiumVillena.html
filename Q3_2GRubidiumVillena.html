<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Club Sign-ups</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            color: #101629;
        }
        .shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }
        .panel {
            background: #fff;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.1);
            border: 1px solid #e3e8ff;
        }
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
        }
        .subtitle {
            margin: 4px 0 24px;
            color: #4b5563;
            font-weight: 500;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #4338ca;
            text-decoration: none;
            font-weight: 600;
        }
        .nav-link:hover {
            text-decoration: underline;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
            margin-bottom: 12px;
        }
        label {
            font-weight: 600;
        }
        select {
            min-width: 240px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #c7d2fe;
            font-size: 1rem;
        }
        select:focus {
            outline: none;
            border-color: #4338ca;
            box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.2);
        }
        .summary {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 8px 0 16px;
        }
        .status-note {
            margin: 0 0 16px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #d8ddf3;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 720px;
        }
        thead {
            background: #0f172a;
            color: #fff;
        }
        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        tbody tr:nth-child(odd) {
            background: #f8fafc;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 768px) {
            .panel {
                padding: 24px;
            }
            select {
                width: 100%;
            }
            table {
                min-width: 640px;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="panel">
            <h1>Show List of Students Who Signed-Up</h1>
            <p class="subtitle">by AL Mendoza</p>
            <a class="nav-link" href="index.html">&#8592; Back to Sign-up</a>

            <div class="controls">
                <label for="clubFilter">Select Your Club</label>
                <select id="clubFilter" aria-label="Filter sign-ups by club">
                    <option value="">-- select an option --</option>
                </select>
            </div>

            <p class="summary">Total Sign-up: <span id="totalCount">0</span></p>
            <p id="statusText" class="status-note">Loading saved sign-ups...</p>

            <div class="table-wrapper hidden" id="tableWrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Club</th>
                            <th>ID</th>
                            <th>Fullname</th>
                            <th>Grade</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Intern | Extern</th>
                        </tr>
                    </thead>
                    <tbody id="signupTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // Sharing the same key as the form page keeps both views in sync without extra plumbing
        const STORAGE_KEY = 'clubSignups';
        const CLUBS = [
            'Science Club',
            'Math Club',
            'Arts Club',
            'Sports Club',
            'Music Club'
        ];

        function loadSignups() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (error) {
                console.error('Unable to load sign-ups', error);
                return [];
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const filter = document.getElementById('clubFilter');
            const totalCount = document.getElementById('totalCount');
            const tableBody = document.getElementById('signupTableBody');
            const statusText = document.getElementById('statusText');
            const tableWrapper = document.getElementById('tableWrapper');
            const signups = loadSignups();

            populateFilter(filter);
            filter.value = 'all';

            // The render is called whenever the filter changes so that table + total stay consistent
            function render(filteredList) {
                totalCount.textContent = filteredList.length;

                if (filteredList.length === 0) {
                    tableWrapper.classList.add('hidden');
                    statusText.textContent = signups.length === 0
                        ? 'No sign-ups have been saved yet. Encourage students to submit the form!'
                        : buildEmptyMessage(filter.value);
                    return;
                }

                tableWrapper.classList.remove('hidden');
                statusText.textContent = '';
                tableBody.innerHTML = '';

                filteredList.forEach((entry) => {
                    const row = document.createElement('tr');
                    const cells = [
                        entry.preferredClub,
                        entry.id,
                        entry.fullName,
                        entry.gradeLabel,
                        entry.email,
                        entry.mobile,
                        entry.role
                    ];

                    cells.forEach((value) => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    tableBody.appendChild(row);
                });
            }

            function buildEmptyMessage(selectedValue) {
                if (selectedValue === 'all' || selectedValue === '') {
                    return 'There are currently no stored sign-ups to show.';
                }
                return `No sign-ups for ${selectedValue}.`;
            }

            function getFilteredList(value) {
                if (value === 'all' || value === '') {
                    return signups;
                }
                return signups.filter((entry) => entry.preferredClub === value);
            }

            render(getFilteredList(filter.value));

            filter.addEventListener('change', () => {
                // It only filters when the dropdown changes.
                const filtered = getFilteredList(filter.value);
                render(filtered);
            });
        });

        function populateFilter(selectEl) {
            const frag = document.createDocumentFragment();
            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = 'All Clubs';
            frag.appendChild(allOption);

            CLUBS.forEach((club) => {
                const option = document.createElement('option');
                option.value = club;
                option.textContent = club;
                frag.appendChild(option);
            });

            selectEl.appendChild(frag);
        }
    </script>
</body>
</html>
